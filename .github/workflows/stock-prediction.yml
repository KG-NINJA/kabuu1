name: Stock Prediction

on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

env:
  DATA_DIR: data
  MODEL_DIR: models

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Create directories
        run: |
          mkdir -p ${{ env.DATA_DIR }}/processed
          mkdir -p ${{ env.MODEL_DIR }}
          mkdir -p logs
          mkdir -p data/rl_history
          mkdir -p data/weekly_reviews
          mkdir -p data/daily_summaries
          echo "✅ Directories created"

      - name: Run prediction pipeline
        run: |
          echo "🚀 Running prediction pipeline"
          PYTHONPATH=. python3 -m src.prediction_pipeline --mode cycle --run-prediction --run-actuals

      - name: Generate LLM Prompts
        run: |
          mkdir -p darwin_analysis/llm_prompts
          python3 src/llm_prompt_generator.py
          echo "✅ LLM prompts generated"
          ls -la darwin_analysis/llm_prompts/ || true
        continue-on-error: true

      # 新規追加: Weekly Review の自動生成（金曜日のみ）
      - name: Generate Weekly Review (Friday only)
        if: github.event.schedule == '0 22 * * 5'
        run: |
          echo "📊 Generating weekly review..."
          python3 << 'EOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))

          from src.rl_enhancement import AdvancedReinforcementLogger, WeeklyReviewGenerator

          rl_logger = AdvancedReinforcementLogger(Path("reinforcement_learning.log"))
          review_gen = WeeklyReviewGenerator(rl_logger)
          review_path = review_gen.generate_and_save()
          print(f"✅ Weekly Review saved: {review_path}")
          EOF
        continue-on-error: true

      # 新規追加: Daily Summary の保存
      - name: Save Daily Summary
        run: |
          echo "💾 Saving daily summary..."
          python3 << 'EOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))

          from src.rl_enhancement import AdvancedReinforcementLogger

          rl_logger = AdvancedReinforcementLogger(Path("reinforcement_learning.log"))
          summary_path = rl_logger.export_daily_summary()
          print(f"✅ Daily summary saved: {summary_path}")
          EOF
        continue-on-error: true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-prediction-${{ github.run_number }}
          path: |
            performance_metrics.json
            reinforcement_learning.log
            data/rl_history/
            data/weekly_reviews/
          if-no-files-found: warn
          retention-days: 7
